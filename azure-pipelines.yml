---
trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Security
    displayName: Security Scanning
    jobs:
      - job: SAST
        displayName: Run SAST & Secret Scan
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: Set Python 3.11

          - script: |
              python -m pip install --upgrade pip
              pip install bandit
              bandit -r app.py
            displayName: Run Bandit

          - script: |
              docker run --rm \
                -v $(System.DefaultWorkingDirectory):/path \
                zricethezav/gitleaks:latest detect \
                --source=/path --verbose || true
            displayName: Run Gitleaks

  - stage: Build
    displayName: Container Build & Scan
    dependsOn: Security
    jobs:
      - job: DockerBuild
        displayName: Build and Scan Docker Image
        steps:
          - script: |
              docker build -t sample-webapp:latest .
            displayName: Build Docker Image

          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --severity HIGH,CRITICAL \
                sample-webapp:latest
            displayName: Run Trivy Scan
