---
trigger:
  branches:
    include:
      - main
      - master

pool:
  name: ubuntu-local

stages:
  - stage: SecretScanning
    displayName: "01. Secret & Credentials Gate"
    jobs:
      - job: gitleaks_scan
        displayName: "Run Gitleaks"
        steps:
          - checkout: self
          - script: |
              echo "Checking for committed credentials..."
              if command -v gitleaks &> /dev/null; then
                gitleaks detect --source . --verbose
              else
                echo "Gitleaks not found globally. Running Docker..."
                docker run --rm \
                  -v $(System.DefaultWorkingDirectory):/path \
                  zricethezav/gitleaks:latest detect --source="/path" --verbose
              fi
            displayName: "Execute Gitleaks Scan"

  - stage: CI_Testing
    displayName: "02. Build & Unit Test"
    dependsOn: SecretScanning
    jobs:
      - job: node_ci
        displayName: "Execute Native Node 22 Test Suite"
        steps:
          - checkout: self
          - task: NodeTool@0
            displayName: "Set Node.js 22 Environment"
            inputs:
              versionSpec: "22.x"
          - script: |
              npm ci
              npm test
            displayName: "Install Clean Lockfile & Run Unit Tests"

  - stage: SAST_SCA
    displayName: "03. Code & Dependency Analysis"
    dependsOn: CI_Testing
    jobs:
      - job: static_security
        displayName: "Semgrep SAST & Trivy Filesystem SCA"
        steps:
          - checkout: self
          - script: |
              pip install semgrep --quiet
              semgrep --config security/semgrep.yml src
            displayName: "Run Semgrep SAST Scan"

          - script: |
              trivy fs \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignorefile security/trivyignore .
            displayName: "Run Trivy Filesystem SCA Audit"

  - stage: Container_Security
    displayName: "04. Image Build & Vulnerability Scan"
    dependsOn: SAST_SCA
    jobs:
      - job: docker_build_scan
        displayName: "Build & Scan Hardened Image"
        steps:
          - checkout: self
          - script: |
              docker build -f docker/Dockerfile -t sample-webapp:latest .
            displayName: "Build Non-Root Multi-Stage Image"

          - script: |
              trivy image \
                --exit-code 1 \
                --severity HIGH,CRITICAL sample-webapp:latest
            displayName: "Scan Built Image with Trivy"

  - stage: DAST
    displayName: "05. Dynamic Runtime Testing (OWASP ZAP)"
    dependsOn: Container_Security
    jobs:
      - job: zap_scan
        displayName: "Execute ZAP Baseline Scan"
        steps:
          - checkout: self
          - script: |
              cd docker
              docker compose up -d
            displayName: "Spin Up App Container"

          - script: |
              docker run --rm \
                --network host \
                -v $(System.DefaultWorkingDirectory):/zap/wrk/:rw \
                owasp/zap2docker-stable zap-baseline.py \
                -t http://127.0.0.1:3000 \
                -r zap-report.html || true
            displayName: "Run OWASP ZAP Baseline Scan"

          - script: |
              cd docker
              docker compose down
            displayName: "Tear Down Local Test Infrastructure"

  - stage: IaC_Governance
    displayName: "06. Infrastructure as Code Validation"
    dependsOn: DAST
    jobs:
      - job: terraform_governance
        displayName: "Terraform Lint, Validate & Plan"
        steps:
          - checkout: self
          - script: |
              cd iac
              terraform init -backend=false
              terraform fmt -check
              terraform validate
              terraform plan
            displayName: "Run Terraform Static Check & Plan-Only"
