trigger:
  branches:
    include:
      - main
      - master

pool:
  name: 'Default'  # Your self-hosted agent pool

variables:
  DOCKER_IMAGE_NAME: 'sample-webapp'
  DOCKER_TAG: '$(Build.BuildId)'

stages:

# ==========================================
# STAGE 1: SECRET SCANNING
# ==========================================
- stage: SecretScanning
  displayName: 'Stage 01: Secret Scanning (Gitleaks)'
  jobs:
  - job: RunGitleaks
    displayName: 'Gitleaks Secret Scan'
    steps:
    - script: |
        docker run --rm \
          -v $(Build.SourcesDirectory):/path \
          zricethezav/gitleaks:latest detect \
          --source=/path \
          --verbose \
          --exit-code=0
      displayName: 'Detect Hardcoded Secrets with Gitleaks'

# ==========================================
# STAGE 2: SAST & SCA
# ==========================================
- stage: SAST_SCA
  displayName: 'Stage 02: SAST & SCA Scanning'
  jobs:
  - job: RunSemgrep
    displayName: 'Semgrep Code Scan'
    steps:
    - script: |
        docker run --rm \
          -v $(Build.SourcesDirectory):/src \
          returntocorp/semgrep semgrep scan \
          --config=p/ci \
          --error
      displayName: 'Execute Semgrep SAST Scan'
      continueOnError: true

  - job: RunNpmAudit
    displayName: 'SCA Dependency Check'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: 'Install Node.js 22'

    - script: |
        npm ci
        npm audit --audit-level=high
      displayName: 'Run npm audit for Vulnerabilities'
      continueOnError: true

# ==========================================
# STAGE 3: BUILD & CONTAINER SECURITY
# ==========================================
- stage: ContainerSecurity
  displayName: 'Stage 03: Build & Container Security'
  jobs:
  - job: BuildAndScanImage
    displayName: 'Build and Scan Docker Image'
    steps:
    - script: |
        docker build -t $(DOCKER_IMAGE_NAME):$(DOCKER_TAG) .
        docker tag $(DOCKER_IMAGE_NAME):$(DOCKER_TAG) $(DOCKER_IMAGE_NAME):latest
      displayName: 'Build Docker Image'

    - script: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(Pipeline.Workspace)/.trivy-cache:/root/.cache/ \
          aquasec/trivy:latest image \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          --timeout 15m \
          --no-progress \
          $(DOCKER_IMAGE_NAME):latest
      displayName: 'Scan Built Image with Trivy'

# ==========================================
# STAGE 4: DAST (DYNAMIC APPLICATION SECURITY TESTING)
# ==========================================
- stage: DAST
  displayName: 'Stage 04: DAST (OWASP ZAP)'
  jobs:
  - job: RunOWASPZAP
    displayName: 'OWASP ZAP Vulnerability Scan'
    steps:
    - script: |
        # Start application container locally on port 3000
        docker run -d --name app-test -p 3000:3000 $(DOCKER_IMAGE_NAME):latest
        sleep 5  # Allow app to fully initialize
      displayName: 'Spin Up Container for Dynamic Scan'

    - script: |
        # Run OWASP ZAP Baseline Scan against local app container host
        docker run --rm \
          --network="host" \
          -v $(Build.SourcesDirectory):/zap/wrk/:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://127.0.0.1:3000 \
          -I || true
      displayName: 'Execute OWASP ZAP Baseline Scan'

    - script: |
        # Cleanup test container after scan completion
        docker stop app-test || true
        docker rm app-test || true
      displayName: 'Cleanup Test Application Container'
      condition: always()

# ==========================================
# STAGE 5: IAC SECURITY & TERRAFORM CHECK
# ==========================================
- stage: IaCSecurity
  displayName: 'Stage 05: Infrastructure as Code (Checkov)'
  jobs:
  - job: RunCheckov
    displayName: 'Checkov Static Analysis'
    steps:
    - script: |
        docker run --rm \
          -v $(Build.SourcesDirectory):/tf \
          bridgecrew/checkov:latest \
          -d /tf \
          --soft-fail
      displayName: 'Scan Terraform / K8s Files with Checkov'
