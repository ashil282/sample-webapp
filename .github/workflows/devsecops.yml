name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  security-and-lint:
    name: 1. Code Security & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Bandit SAST Scan
        run: |
          bandit -r app.py

      - name: Run Gitleaks Secret Scanner
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/path \
            zricethezav/gitleaks:latest detect \
            --source=/path --verbose || true

  build-and-scan:
    name: 2. Build & Container Security
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t sample-webapp:latest .

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-db-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy Container Vulnerability Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/.trivycache:/root/.cache/ \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            sample-webapp:latest

  deploy-validation:
    name: 3. Ephemeral K8s Deployment & Rollback Test
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t sample-webapp:local .

      - name: Provision Ephemeral Kind Cluster
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name dev-cluster

      - name: Load Image into Kind Cluster
        run: |
          kind load docker-image sample-webapp:local --name dev-cluster

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/app.yaml

      - name: Validate Deployment Rollout
        run: |
          echo "Validating pod status..."
          if ! kubectl rollout status deployment/sample-webapp --timeout=60s; then
            echo "ERROR: Rollout failed! Executing automated rollback..."
            kubectl get pods -l app=sample-webapp
            kubectl describe deployment sample-webapp
            kubectl rollout undo deployment/sample-webapp
            kubectl rollout status deployment/sample-webapp --timeout=60s
            exit 1
          fi
          echo "Deployment succeeded!"
