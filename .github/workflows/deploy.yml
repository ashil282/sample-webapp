name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-and-lint:
    name: 1. SAST & Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit yamllint

      - name: Run Bandit (SAST)
        run: |
          bandit -r . -x ./tests

      - name: Run Yamllint
        run: |
          yamllint .

  container-security:
    name: 2. Container Build & Security Scan
    needs: sast-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t sample-webapp:latest .

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sample-webapp:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  ephemeral-k8s-deploy:
    name: 3. Ephemeral Kind Validation
    needs: container-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-ci

      - name: Build Docker Image
        run: |
          docker build -t sample-webapp:latest .

      - name: Load Image into Kind
        run: |
          kind load docker-image sample-webapp:latest --name kind-ci

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout status deployment/sample-webapp --timeout=90s

      - name: Verify Running Pods & Services
        run: |
          kubectl get pods -o wide
          kubectl get svc
